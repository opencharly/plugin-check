# Makes this plugin repo a PROJECT so its own candy is actually gated.
#
# Without a root charly.yml the repo is "project-less": charly scans NO candies at all,
# so `charly box validate` at the repo root exits 0 on ANY manifest, including one with
# a malformed `plugin.providers` entry. The stock candy CI step asserted nothing.
# See opencharly/charly#459.
#
# Declaring discover: is the whole fix: the candy is scanned, the CUE schema gate
# applies, and the STOCK `charly box validate` step starts working with no workflow
# change. The `import:` and the `local:` entities below are this repo's in-repo R10
# witnesses (opencharly/plugin-check#78 and #86) — see their own comments.
import:
    - dottedfix: ./testdata/dotted-local-fixture

discover:
    - path: candy
      recursive: true

# The in-repo R10 witness for opencharly/plugin-check#78. The repo root IMPORTS its own
# `testdata/dotted-local-fixture` project as the namespace `dottedfix`, so that project's
# `kind: local` bed is addressed ONLY as the namespace-qualified `dottedfix.dottedfix-bed` —
# the dotted-key shape the local-arm resolver must handle. This bed drives that resolution
# through a real `charly check run`, so it aborts at name resolution before the fix and runs
# the fixture's plan after it.
check-dotted-local-resolve-app:
  local:
    description: bare kind:local template for the dotted-local resolver R10 bed
    candy: []

check-dotted-local-resolve:
  local:
    from: check-dotted-local-resolve-app
    host: local
    disposable: true
    description: >-
      R10 witness for opencharly/plugin-check#78: a disposable kind:local bed whose plan drives
      `charly check live dottedfix.dottedfix-bed` — a NAMESPACE-QUALIFIED kind:local bed. Before the
      fix the local arm re-resolved that name with the in-substrate-only member walk, which cannot
      reach a dotted top-level key, so the command exited non-zero with `local deployment
      "dottedfix.dottedfix-bed" not found` and never ran a step; after the fix the fixture bed's
      plan runs and prints its step id.
    plan:
      - check: a namespace-qualified kind:local bed resolves and reaches its plan
        id: dotted-local-resolves
        exit_status: 0
        stderr:
          - contains: dottedfix-plan-ran
        context: [runtime]
        command:
          command: ${CHARLY_BIN} check live dottedfix.dottedfix-bed
          in_container: false

# The in-repo R10 witness for opencharly/plugin-check#86. `check-nonhost-leaf` is a HOST-venue
# (`kind: local`) entity carrying an in-substrate member that is a NON-host `pod`, so the dotted
# name `check-nonhost-leaf.check-nonhost-leaf-pod` resolves its LEAF to a container venue while its
# ROOT is host-venue — exactly the shape `checkLocalTarget`'s dispatch decides. Before the fix the
# resolved non-host leaf fell through to the host root's fallback, the name was local-routed, the
# (empty) local plan succeeded and the nested command exited 0; after the fix the POD arm owns the
# name and reports the deliberately un-started container, which is the assertion below.
check-nonhost-leaf-app:
  local:
    description: bare kind:local template for the non-host-leaf dispatch witness bed
    candy: []

check-nonhost-leaf:
  local:
    description: >-
      HOST root carrying the in-substrate NON-host (pod) member the #86 dispatch witness targets.
      It is deliberately NOT a template (a local body carrying a member decodes as a deploy node),
      so it exists only to be the dotted name's ROOT: `check-nonhost-leaf.check-nonhost-leaf-pod`
      resolves a container-venue LEAF under a host-venue root.
    candy: []
    check-nonhost-leaf-pod:
      pod:
        description: the NON-host LEAF — a container-venue member under a host root, never started
        image: alpine:3.20

check-nonhost-leaf-route:
  local:
    from: check-nonhost-leaf-app
    host: local
    disposable: true
    description: >-
      R10 witness for opencharly/plugin-check#86: `charly check live check-nonhost-leaf.check-nonhost-leaf-pod`
      must dispatch on the RESOLVED LEAF's venue (the pod arm) instead of falling through to the
      host root. The assertion is the routing's observable consequence — the pod arm refusing the
      container it was never asked to start, where the pre-fix local arm quietly succeeded.
    plan:
      - check: a resolved NON-host leaf under a HOST root is dispatched to its own venue, not local
        id: nonhost-leaf-routed-to-its-venue
        exit_status: 1
        stderr:
          - contains: is not running
        context: [runtime]
        command:
          command: ${CHARLY_BIN} check live check-nonhost-leaf.check-nonhost-leaf-pod
          in_container: false

# The in-repo R10 witness for opencharly/plugin-check#110 — the VACUOUS CHILD PHASE.
#
# The class bed (charly's assembled `check-local-vm`) exercises the command surface end to end but
# CANNOT reach this change's branch: every child it runs resolves a real plan, so no phase ever takes
# the empty-resolution path — a run that would be byte-identical without the change. This bed IS that
# path, authored in the same in-repo idiom as the #78 and #86 witnesses above.
check-empty-venue:
  local:
    description: >-
      Bare kind:local template whose deployments resolve NO plan steps — an explicit empty `candy:`
      list says "deliberately nothing", so no candy plan can contribute one either.
    candy: []

check-empty-resolution-witness:
  local:
    from: check-empty-venue
    host: local
    disposable: true
    description: >-
      R10 witness for opencharly/plugin-check#110. The change makes an EMPTY plan resolution a SKIP —
      exit 3 with a `SKIPPED — …` line naming the issue — instead of the exit-0 non-verdict it was,
      and makes a bed record such a phase with a per-step `skip_reason` instead of banking it as a
      pass. The plan step asserts the first half by driving the empty child phase through
      `charly check live` and requiring the skip (before the change that command exits 0 and prints
      no such line, so this step FAILS without it); the nested CHILD is what makes the bed runner
      take the same path as its own phase, so the run's summary.yml records the skipped phase WITH
      its reason — the emitted artefact this change adds.
    plan:
      - check: an EMPTY plan resolution is a SKIP — exit 3 with a SKIPPED line naming the issue — not the exit-0 non-verdict it used to be
        id: empty-resolution-is-a-skip
        exit_status: 3
        stderr:
          - contains: SKIPPED —
          - contains: opencharly/plugin-check#110
        context: [runtime]
        command:
          command: ${CHARLY_BIN} check live check-empty-resolution-witness.empty-plan-child
          in_container: false
    empty-plan-child:
      local:
        description: >-
          The empty-resolution CHILD: no `plan:` of its own and no candy to contribute one, so the
          phase the bed runner drives for it resolves NOTHING.
        candy: []
